[package]
name = "wokwi-test-runner"
version = "0.1.0"
edition = "2021"
description = "Run embedded-test binaries in Wokwi via GDB remote protocol"

[dependencies]
addr2line = { version = "0.27.1", default-features = false, features = ["std"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gimli = { version = "0.34", default-features = false, features = ["std", "endian-reader"] }
object = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"


